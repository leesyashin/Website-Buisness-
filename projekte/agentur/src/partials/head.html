<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f1ee" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!-- Startzustände für Bewegung nur, wenn sie erwünscht ist; Sicherheitsnetz nach 3 s -->
<script>
  if (matchMedia('(prefers-reduced-motion: no-preference)').matches) {
    document.documentElement.classList.add('motion-pending');
    setTimeout(() => document.documentElement.classList.remove('motion-pending'), 3000);
  }
</script>
